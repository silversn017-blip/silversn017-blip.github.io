<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="专注仪表">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23ffffff'/%3E%3Ctext x='50' y='75' font-size='70' text-anchor='middle'%3E🐾%3C/text%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23ffffff'/%3E%3Ctext x='50' y='75' font-size='70' text-anchor='middle'%3E🐾%3C/text%3E%3C/svg%3E">
  <title>专注仪表</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #f7f7f7; color: #1e1e1e; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 1rem; overflow: hidden; height: 100vh; }
    .app { max-width: 800px; width: 100%; height: 100vh; max-height: 900px; background: #ffffff; border-radius: 2rem; box-shadow: 0 8px 24px rgba(0,0,0,0.04); padding: 2rem 1.8rem 6rem; position: relative; display: flex; flex-direction: column; overflow: hidden; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #ffffff; border-top: 1px solid #eaeaea; display: flex; justify-content: space-around; align-items: center; padding: 0.6rem 0.8rem 0.8rem; z-index: 100; max-width: 800px; left: 50%; transform: translateX(-50%); border-radius: 2rem 2rem 0 0; }
    .bottom-nav button { background: transparent; border: none; font-size: 0.8rem; font-weight: 450; color: #555; padding: 0.3rem 0.8rem; border-radius: 40px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0.15rem; }
    .bottom-nav button.active { background: #1e1e1e; color: white; }
    .bottom-nav button .icon { font-size: 1.4rem; line-height: 1; }
    .section { display: none; flex-direction: column; flex: 1; overflow: hidden; }
    .section.active { display: flex; }
