<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="专注仪表">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23ffffff'/%3E%3Ctext x='50' y='75' font-size='70' text-anchor='middle'%3E🐾%3C/text%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23ffffff'/%3E%3Ctext x='50' y='75' font-size='70' text-anchor='middle'%3E🐾%3C/text%3E%3C/svg%3E">
  <title>专注仪表</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #f7f7f7; color: #1e1e1e; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 1rem; overflow: hidden; height: 100vh; }
    .app { max-width: 800px; width: 100%; height: 100vh; max-height: 900px; background: #ffffff; border-radius: 2rem; box-shadow: 0 8px 24px rgba(0,0,0,0.04); padding: 2rem 1.8rem 6rem; position: relative; display: flex; flex-direction: column; overflow: hidden; }
    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #ffffff; border-top: 1px solid #eaeaea; display: flex; justify-content: space-around; align-items: center; padding: 0.6rem 0.8rem 0.8rem; z-index: 100; max-width: 800px; left: 50%; transform: translateX(-50%); border-radius: 2rem 2rem 0 0; }
    .bottom-nav button { background: transparent; border: none; font-size: 0.8rem; font-weight: 450; color: #555; padding: 0.3rem 0.8rem; border-radius: 40px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0.15rem; }
    .bottom-nav button.active { background: #1e1e1e; color: white; }
    .bottom-nav button .icon { font-size: 1.4rem; line-height: 1; }
    .section { display: none; flex-direction: column; flex: 1; overflow: hidden; }
    .section.active { display: flex; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; flex-shrink: 0; }
    .logo { font-weight: 600; font-size: 1.5rem; letter-spacing: -0.5px; }
    .logo span { background: #1e1e1e; color: white; padding: 0.1rem 0.7rem; border-radius: 40px; font-size: 0.8rem; margin-left: 0.4rem; }
    .profile-mini { display: flex; align-items: center; gap: 0.6rem; background: #f0f0f0; padding: 0.3rem 1rem 0.3rem 0.8rem; border-radius: 40px; cursor: pointer; }
    .profile-mini img { width: 32px; height: 32px; border-radius: 50%; background: #d0d0d0; object-fit: cover; }
    .profile-mini span { font-size: 0.9rem; font-weight: 450; }
    .top-paw-btn { background: #f0f0f0; border: none; border-radius: 30px; padding: 0.1rem 0.6rem; font-size: 1.2rem; cursor: pointer; line-height: 1.6; }
    /* ===== 专注页面 ===== */
    #sectionHome { position: relative; }
    .timer-section { background: #f3f3f3; border-radius: 2.5rem; padding: 1.8rem 1.5rem; text-align: center; flex-shrink: 0; }
    .timer-display { font-size: 4.2rem; font-weight: 300; letter-spacing: 4px; font-variant-numeric: tabular-nums; margin-bottom: 0.3rem; color: #111; }
    .timer-controls { display: flex; justify-content: center; gap: 0.6rem; flex-wrap: wrap; margin: 0.5rem 0 0.4rem; }
    .timer-controls button { background: #1e1e1e; border: none; color: white; padding: 0.4rem 1.4rem; border-radius: 60px; font-size: 0.85rem; font-weight: 450; cursor: pointer; }
    .timer-controls button.outline { background: transparent; color: #1e1e1e; border: 1px solid #bbb; }
    .timer-note-area { margin-top: 0.8rem; display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; justify-content: center; }
    .timer-note-area input { flex: 1; min-width: 120px; padding: 0.4rem 0.8rem; border: 1px solid #ccc; border-radius: 60px; background: white; font-size: 0.85rem; outline: none; height: 38px; }
    .timer-note-area input:focus { border-color: #1e1e1e; }
    .timer-note-area button { background: #1e1e1e; color: white; border: none; padding: 0.4rem 1rem; border-radius: 60px; font-size: 0.8rem; cursor: pointer; height: 38px; white-space: nowrap; }
    .type-selector { margin-top: 0.6rem; display: flex; justify-content: center; align-items: center; }
    .type-selector .type-label { background: #f0f0f0; padding: 0.2rem 1rem; border-radius: 40px; font-size: 0.85rem; cursor: pointer; display: inline-block; color: #333; font-weight: 450; }
    .type-selector .type-label.active { background: #1e1e1e; color: white; font-weight: 600; }
    .test-entry { margin-top: 0.6rem; text-align: center; }
    .test-entry button { background: none; border: none; color: #ccc; font-size: 0.7rem; cursor: pointer; padding: 0.2rem 0.6rem; }
    .test-entry button:active { color: #999; }
    /* ===== 统计页面（推入） ===== */
    .stats-page { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #ffffff; border-radius: 2rem; padding: 1.8rem 1.8rem 2rem; z-index: 20; transform: translateX(100%); transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1); overflow-y: auto; box-shadow: -4px 0 24px rgba(0,0,0,0.04); }
    .stats-page.open { transform: translateX(0); }
    .stats-page .stats-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem; }
    .stats-page .stats-header .back-btn { background: none; border: none; font-size: 1rem; cursor: pointer; color: #333; padding: 0.2rem 0.2rem 0.2rem 0; display: flex; align-items: center; gap: 0.2rem; }
    .stats-page .stats-header .back-btn span { font-size: 1.2rem; }
    .stats-page .stats-header h2 { font-size: 1.2rem; font-weight: 500; letter-spacing: -0.3px; }
    .stats-page .stats-header .layout-toggle { background: none; border: none; color: #ccc; font-size: 0.8rem; cursor: pointer; padding: 0.1rem 0.3rem; }
    .stats-page .stats-tabs { display: flex; gap: 0.3rem; margin-bottom: 1.2rem; }
    .stats-page .stats-tabs button { background: transparent; border: none; padding: 0.2rem 0.8rem; border-radius: 40px; font-size: 0.8rem; cursor: pointer; color: #999; font-weight: 450; }
    .stats-page .stats-tabs button.active { background: #1e1e1e; color: white; }
    .stats-page .stats-content { display: flex; flex-direction: column; gap: 1rem; }
    .stats-page .stats-content .layout-a { display: flex; align-items: center; gap: 1.2rem; }
    .stats-page .stats-content .layout-a .left-stat { flex: 0 0 auto; min-width: 100px; }
    .stats-page .stats-content .layout-a .left-stat .num { font-size: 2.2rem; font-weight: 500; line-height: 1.2; }
    .stats-page .stats-content .layout-a .left-stat .label { font-size: 0.75rem; color: #999; }
    .stats-page .stats-content .layout-a .chart-wrap { flex: 1; display: flex; justify-content: center; position: relative; }
    .stats-page .stats-content .layout-b { display: flex; flex-direction: column; align-items: center; }
    .stats-page .stats-content .layout-b .center-stat { text-align: center; margin-bottom: 0.2rem; }
    .stats-page .stats-content .layout-b .center-stat .num { font-size: 2.6rem; font-weight: 500; line-height: 1.2; }
    .stats-page .stats-content .layout-b .center-stat .label { font-size: 0.75rem; color: #999; }
    .stats-page .stats-content .layout-b .chart-wrap { display: flex; justify-content: center; position: relative; }
    .stats-page .stats-content .layout-a.hidden, .stats-page .stats-content .layout-b.hidden { display: none; }
    .stats-page .stats-content .chart-wrap svg { max-width: 180px; height: auto; }
    .chart-toggle-btn { position: absolute; bottom: 4px; right: 4px; background: none; border: none; color: #ddd; font-size: 0.7rem; cursor: pointer; padding: 0.1rem 0.3rem; z-index: 5; }
    .chart-toggle-btn:active { color: #999; }
    .legend-list { list-style: none; margin-top: 0.4rem; }
    .legend-list li { display: flex; justify-content: space-between; align-items: center; padding: 0.3rem 0; border-bottom: 1px solid #f0f0f0; font-size: 0.85rem; }
    .legend-list li .type-name { font-weight: 500; flex: 0 0 auto; min-width: 60px; }
    .legend-list li .type-duration { color: #666; flex: 1; text-align: right; margin-right: 0.8rem; }
    .legend-list li .type-percent { color: #999; flex: 0 0 auto; min-width: 40px; text-align: right; }
    .stats-page .stats-content .no-data { text-align: center; color: #ccc; font-size: 1.2rem; padding: 2rem 0; letter-spacing: 1px; }
    /* ===== 心情日历（独立推入页） ===== */
    .mood-page { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #ffffff; border-radius: 2rem; padding: 1.8rem 1.5rem 2rem; z-index: 15; transform: translateX(100%); transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1); overflow-y: auto; }
    .mood-page.open { transform: translateX(0); }
    .mood-page .mood-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem; }
    .mood-page .mood-header .mood-back { background: none; border: none; font-size: 1rem; cursor: pointer; color: #333; display: flex; align-items: center; gap: 0.2rem; }
    .mood-page .mood-header .mood-back span { font-size: 1.2rem; }
    .mood-page .mood-header h2 { font-size: 1rem; font-weight: 700; letter-spacing: 1px; color: #1e1e1e; }
    .mood-page .mood-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem; }
    .mood-page .mood-nav button { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #555; padding: 0.2rem 0.6rem; }
    .mood-page .mood-nav .mood-month { font-size: 0.95rem; font-weight: 700; color: #1e1e1e; }
    .mood-page .mood-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 0.6rem; font-weight: 600; color: #999; letter-spacing: 0.3px; margin-bottom: 0.1rem; padding: 0 0.1rem; }
    /* ===== 整个日历卡片（统一圆角白底+阴影） ===== */
    .mood-page .mood-card { background: #ffffff; border-radius: 1.2rem; padding: 0.6rem 0.4rem 0.4rem 0.4rem; box-shadow: 0 2px 12px rgba(0,0,0,0.04); margin-top: 0.1rem; }
    .mood-page .mood-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.15rem; }
    .mood-page .mood-grid .mood-cell { display: flex; flex-direction: column; align-items: center; padding: 0.2rem 0.1rem; justify-content: flex-start; background: transparent; }
    .mood-page .mood-grid .mood-cell .mood-dot { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid #f0f0f0; margin-bottom: 0.1rem; transition: 0.15s; flex-shrink: 0; }
    .mood-page .mood-grid .mood-cell .mood-date { font-size: 0.6rem; font-weight: 500; color: #333; line-height: 1; }
    .mood-page .mood-grid .mood-cell .mood-date.today { font-weight: 700; color: #1e1e1e; }
    .mood-page .mood-grid .mood-cell.other-month .mood-date { color: #ccc; }
    .mood-page .mood-grid .mood-cell.other-month .mood-dot { opacity: 0.3; }
    .mood-page .mood-grid .mood-cell.disabled { opacity: 0.5; cursor: default; }
    /* ===== 颜色选择弹窗（极小版） ===== */
    .color-picker-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.25); z-index: 300; justify-content: center; align-items: center; }
    .color-picker-overlay.active { display: flex; }
    .color-picker-box { background: #ffffff; border-radius: 1.2rem; padding: 0.8rem 1rem; width: 200px; max-width: 80%; box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
    .color-picker-box .color-options { display: flex; gap: 0.6rem; justify-content: center; padding: 0.2rem 0; }
    .color-picker-box .color-options .color-circle { width: 32px; height: 32px; border-radius: 50%; border: 2px solid #f0f0f0; cursor: pointer; transition: 0.15s; flex-shrink: 0; }
    .color-picker-box .color-options .color-circle.selected { border-color: #1e1e1e; box-shadow: 0 0 0 2px #ffffff, 0 0 0 3px #1e1e1e; }
    .color-picker-box .color-options .color-circle:active { transform: scale(0.92); }
    .color-picker-box .picker-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 0.4rem; padding-top: 0.3rem; border-top: 1px solid #f5f5f5; }
    .color-picker-box .picker-footer .picker-cancel { background: none; border: none; color: #ccc; font-size: 0.85rem; cursor: pointer; padding: 0.1rem 0.2rem; }
    .color-picker-box .picker-footer .picker-cancel:active { color: #999; }
    .color-picker-box .picker-footer .custom-option { background: none; border: none; color: #ccc; font-size: 0.7rem; cursor: pointer; padding: 0.1rem 0.2rem; text-transform: lowercase; letter-spacing: 0.3px; }
    .color-picker-box .picker-footer .custom-option:active { color: #999; }
    /* ===== 调色盘弹窗 ===== */
    .palette-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 400; justify-content: center; align-items: center; }
    .palette-overlay.active { display: flex; }
    .palette-box { background: #ffffff; border-radius: 1.5rem; padding: 1.8rem; width: 320px; max-width: 90%; box-shadow: 0 12px 40px rgba(0,0,0,0.12); }
    .palette-box .palette-title { font-size: 1rem; font-weight: 500; text-align: center; margin-bottom: 0.8rem; }
    .palette-box .palette-preview { width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 0.8rem; border: 2px solid #f0f0f0; }
    .palette-box .palette-slider { margin-bottom: 0.6rem; }
    .palette-box .palette-slider label { display: block; font-size: 0.75rem; color: #999; margin-bottom: 0.1rem; }
    .palette-box .palette-slider input[type="range"] { width: 100%; height: 4px; -webkit-appearance: none; appearance: none; background: #ddd; border-radius: 2px; outline: none; }
    .palette-box .palette-slider input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #1e1e1e; cursor: pointer; }
    .palette-box .palette-confirm { display: block; width: 100%; padding: 0.5rem 0; margin-top: 0.8rem; border: none; border-radius: 40px; font-size: 0.9rem; font-weight: 450; cursor: pointer; background: #1e1e1e; color: white; }
    .palette-box .palette-cancel { display: block; width: 100%; padding: 0.4rem 0; margin-top: 0.2rem; border: none; background: transparent; color: #999; font-size: 0.85rem; cursor: pointer; }
    /* ===== 类型/编辑弹窗 ===== */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); z-index: 200; justify-content: center; align-items: flex-end; }
    .modal-overlay.active { display: flex; }
    .modal-box { background: #ffffff; border-radius: 1.5rem 1.5rem 0 0; padding: 1.5rem 1.8rem 2rem; width: 100%; max-width: 500px; max-height: 80vh; overflow-y: auto; }
    .modal-box .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .modal-box .modal-header h3 { font-size: 1rem; font-weight: 500; color: #333; }
    .modal-box .modal-header .close-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #999; }
    .modal-box .type-item { padding: 0.6rem 0.4rem; border-bottom: 1px solid #f0f0f0; cursor: pointer; font-size: 0.95rem; display: flex; justify-content: space-between; align-items: center; }
    .modal-box .type-item:active { background: #f5f5f5; }
    .modal-box .type-item.selected { font-weight: 600; background: #f0f0f0; border-radius: 8px; }
    .modal-box .type-item .del-btn { background: none; border: none; color: #ccc; font-size: 0.8rem; cursor: pointer; padding: 0.1rem 0.3rem; }
    .modal-box .type-item .del-btn:active { color: #e74c3c; }
    .modal-box .input-row { display: flex; gap: 0.4rem; margin-top: 0.6rem; }
    .modal-box .input-row input { flex: 1; padding: 0.4rem 0.8rem; border: 1px solid #ccc; border-radius: 40px; font-size: 0.9rem; outline: none; height: 38px; }
    .modal-box .input-row input:focus { border-color: #1e1e1e; }
    .modal-box .input-row button { background: #1e1e1e; color: white; border: none; padding: 0 1.2rem; border-radius: 40px; font-size: 0.85rem; cursor: pointer; }
    .modal-box .cancel-btn { display: block; width: 100%; padding: 0.6rem 0; margin-top: 0.8rem; border: none; background: transparent; color: #999; font-size: 0.9rem; cursor: pointer; }
    /* ===== 编辑记录弹窗 ===== */
    .edit-item { padding: 0.6rem 0; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; }
    .edit-item .edit-info { flex: 1; }
    .edit-item .edit-info .edit-date { color: #999; font-size: 0.75rem; }
    .edit-item .edit-actions button { background: none; border: none; color: #999; font-size: 0.8rem; cursor: pointer; padding: 0.1rem 0.3rem; }
    .edit-item .edit-actions button:active { color: #333; }
    .edit-add-btn { display: block; width: 100%; padding: 0.5rem; margin-top: 0.4rem; border: 1px dashed #ddd; border-radius: 40px; background: transparent; color: #999; font-size: 0.85rem; cursor: pointer; }
    /* ===== 其他页面 ===== */
    #sectionTweets, #sectionPlans, #sectionProfile { padding-bottom: 0.5rem; overflow-y: auto; }
    #sectionProfile { position: relative; }
    .profile-section { background: #f8f8f8; border-radius: 2rem; padding: 1.8rem 1.8rem 1.2rem; margin: 0.5rem 0; }
    .profile-header { display: flex; align-items: center; gap: 1.2rem; flex-wrap: wrap; }
    .profile-avatar { width: 72px; height: 72px; border-radius: 50%; background: #ccc; background-size: cover; background-position: center; flex-shrink: 0; border: 2px solid white; box-shadow: 0 2px 6px rgba(0,0,0,0.04); cursor: pointer; }
    .profile-info { flex: 1; min-width: 120px; }
    .profile-info .name-row { display: flex; align-items: center; gap: 0.3rem; flex-wrap: wrap; font-size: 1.3rem; font-weight: 500; }
    .profile-info .name-row input { border: none; border-bottom: 1px solid #ccc; background: transparent; font-size: 1.3rem; font-weight: 500; outline: none; width: 60px; padding: 0; }
    .profile-info .name-row .ip-input { border: none; border-bottom: 1px solid #ccc; background: transparent; font-size: 0.9rem; font-weight: 400; outline: none; width: 50px; padding: 0; color: #666; }
    .profile-info .name-row .hash { font-size: 0.9rem; color: #888; font-weight: 300; }
    .profile-info .bio-line { font-size: 0.9rem; color: #444; margin-top: 0.2rem; cursor: pointer; }
    .profile-info .bio-line input { border: none; border-bottom: 1px solid #ccc; background: transparent; font-size: 0.9rem; outline: none; width: 140px; color: #444; padding: 0; }
    .profile-divider { border: none; height: 1px; background: #e0e0e0; margin: 0.8rem 0; width: 100%; flex-shrink: 0; border-radius: 0 !important; }
    .profile-stats { display: flex; gap: 2rem; }
    .profile-stats div { font-size: 0.9rem; }
    .profile-stats strong { font-weight: 600; }
    .profile-save-btn { background: #1e1e1e; border: none; padding: 0.3rem 1.2rem; border-radius: 40px; font-size: 0.8rem; cursor: pointer; color: white; margin-top: 0.2rem; }
    .swipe-hint-mood { text-align: center; color: #ccc; font-size: 0.7rem; margin-top: 0.3rem; flex-shrink: 0; letter-spacing: 0.5px; }
    /* ===== 其他 ===== */
    .tweet-box textarea { width: 100%; border: 1px solid #ddd; border-radius: 1.8rem; padding: 1rem 1.2rem; font-size: 0.95rem; resize: vertical; min-height: 80px; background: #fafafa; outline: none; }
    .tweet-box textarea:focus { border-color: #1e1e1e; background: #fff; }
    .tweet-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 0.6rem; flex-wrap: wrap; }
    .tweet-actions label { background: #f0f0f0; padding: 0.3rem 1rem; border-radius: 60px; font-size: 0.85rem; cursor: pointer; border: 1px solid #ddd; }
    .tweet-actions label input { display: none; }
    .tweet-actions button { background: #1e1e1e; color: white; border: none; padding: 0.4rem 2rem; border-radius: 60px; font-size: 0.9rem; cursor: pointer; }
    .tweet-feed { margin-top: 1.5rem; }
    .tweet-item { border-bottom: 1px solid #ececec; padding: 1rem 0; display: flex; gap: 0.8rem; align-items: flex-start; }
    .tweet-item .avatar { width: 40px; height: 40px; background: #d0d0d0; border-radius: 50%; flex-shrink: 0; background-size: cover; background-position: center; }
    .tweet-item .content { flex: 1; }
    .tweet-item .content .meta { font-size: 0.8rem; color: #666; margin-bottom: 0.2rem; }
    .tweet-item .content .text { font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; }
    .tweet-item .content .img-preview { margin-top: 0.4rem; max-width: 100%; max-height: 200px; border-radius: 1rem; background: #eee; object-fit: cover; }
    .tweet-item .delete-tweet { background: none; border: none; color: #ccc; font-size: 1.2rem; cursor: pointer; padding: 0 0.2rem; flex-shrink: 0; margin-top: 0.1rem; }
    .tweet-item .delete-tweet:active { color: #e74c3c; }
    .plan-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; flex-wrap: wrap; gap: 0.5rem; }
    .plan-header > span { font-weight: 500; font-size: 1.1rem; }
    .plan-date-nav { display: flex; align-items: center; gap: 0.6rem; }

<script>
(function(){
  // ========== 数据 ==========
  var store = {
    timerRecords: [],
    tweets: [],
    plans: [],
    profile: { name: '我', ip: '上海', bio: '极简 · 专注', avatar: '' },
    types: [],
    selectedType: null,
    statsTab: 'month',
    layoutMode: 'a',
    chartMode: 'arc',
    moodColors: {},
    presetColors: ['#d0d0d0', '#FF6B6B', '#4ECDC4', '#FFE66D']
  };

  function loadStore() {
    try {
      var raw = localStorage.getItem('focusMeData');
      if (raw) {
        var parsed = JSON.parse(raw);
        store = parsed;
        if (!store.timerRecords) store.timerRecords = [];
        if (!store.tweets) store.tweets = [];
        if (!store.plans) store.plans = [];
        if (!store.profile) store.profile = { name: '我', ip: '上海', bio: '极简 · 专注', avatar: '' };
        if (!store.types) store.types = [];
        if (store.selectedType === undefined) store.selectedType = null;
        if (!store.statsTab) store.statsTab = 'month';
        if (!store.layoutMode) store.layoutMode = 'a';
        if (!store.chartMode) store.chartMode = 'arc';
        if (!store.moodColors) store.moodColors = {};
        if (!store.presetColors || store.presetColors.length === 0) {
          store.presetColors = ['#d0d0d0', '#FF6B6B', '#4ECDC4', '#FFE66D'];
        }
      }
    } catch(e) {}
  }
  function saveStore() { localStorage.setItem('focusMeData', JSON.stringify(store)); }
  loadStore();

  // ========== 工具 ==========
  function formatTime(sec) {
    var h = String(Math.floor(sec / 3600)).padStart(2, '0');
    var m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
    var s = String(Math.floor(sec % 60)).padStart(2, '0');
    return h + ':' + m + ':' + s;
  }
  function formatDuration(sec) {
    var h = Math.floor(sec / 3600);
    var m = Math.floor((sec % 3600) / 60);
    if (h > 0) return h + 'h ' + m + 'm';
    return m + 'm';
  }
  function getToday() { return new Date().toISOString().slice(0,10); }
  function getWeekRange() {
    var now = new Date();
    var day = now.getDay();
    var diff = now.getDate() - day + (day === 0 ? -6 : 1);
    var monday = new Date(now);
    monday.setDate(diff);
    var sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);
    return { start: monday.toISOString().slice(0,10), end: sunday.toISOString().slice(0,10) };
  }
  function getMonthRange() {
    var now = new Date();
    var start = new Date(now.getFullYear(), now.getMonth(), 1);
    var end = new Date(now.getFullYear(), now.getMonth() + 1, 0);
    return { start: start.toISOString().slice(0,10), end: end.toISOString().slice(0,10) };
  }
  function getYearRange() {
    var now = new Date();
    var start = new Date(now.getFullYear(), 0, 1);
    var end = new Date(now.getFullYear(), 11, 31);
    return { start: start.toISOString().slice(0,10), end: end.toISOString().slice(0,10) };
  }
  function getDateRange(tab) {
    if (tab === 'day') return { start: getToday(), end: getToday() };
    if (tab === 'week') return getWeekRange();
    if (tab === 'year') return getYearRange();
    return getMonthRange();
  }

  function getTypeColor(index, total) {
    if (total === 0) return '#e0e0e0';
    var gray = Math.floor(180 - (index / total) * 150);
    var c = Math.max(50, Math.min(200, gray));
    return 'rgb(' + c + ',' + c + ',' + c + ')';
  }

  function getStatsData(tab) {
    var range = getDateRange(tab);
    var records = store.timerRecords.filter(function(r) {
      return r.date >= range.start && r.date <= range.end;
    });
    if (records.length === 0) return null;
    var total = 0;
    var typeMap = {};
    records.forEach(function(r) {
      total += r.durationSec || 0;
      var type = r.type || '未分类';
      if (!typeMap[type]) typeMap[type] = 0;
      typeMap[type] += r.durationSec || 0;
    });
    var items = Object.keys(typeMap).map(function(key) {
      return { type: key, duration: typeMap[key], percent: (typeMap[key] / total) * 100 };
    });
    items.sort(function(a, b) { return b.duration - a.duration; });
    return { total: total, items: items, count: records.length };
  }

  // ========== 统计渲染 ==========
  function renderStats() {
    var tab = store.statsTab;
    var data = getStatsData(tab);
    var labels = { day: '今日专注', week: '本周日均', month: '本月日均', year: '本年日均' };
    var labelText = labels[tab] || '本月日均';

    var numElA = document.getElementById('statNum');
    var labelElA = document.getElementById('statLabel');
    var numElB = document.getElementById('statNumB');
    var labelElB = document.getElementById('statLabelB');

    var noData = document.getElementById('noData');
    var legendList = document.getElementById('legendList');

    if (!data || data.total === 0) {
      numElA.textContent = '0';
      labelElA.textContent = labelText;
      numElB.textContent = '0';
      labelElB.textContent = labelText;
      noData.classList.remove('hidden');
      legendList.innerHTML = '';
      document.getElementById('pieChartA').innerHTML = '';
      document.getElementById('pieChartB').innerHTML = '';
      return;
    }

    noData.classList.add('hidden');

    var avg = data.total / data.count;
    var avgStr = formatDuration(avg);
    numElA.textContent = avgStr;
    labelElA.textContent = labelText;
    numElB.textContent = avgStr;
    labelElB.textContent = labelText;

    var svgA = document.getElementById('pieChartA');
    var svgB = document.getElementById('pieChartB');
    var cx = 80, cy = 80, r = 60, strokeWidth = 14;
    var total = data.total;
    var items = data.items;
    var totalItems = items.length;
    var mode = store.chartMode;

    function buildChart(svg, items, total, totalItems, mode) {
      svg.innerHTML = '';
      var accumulated = 0;
      var sorted = items.slice().sort(function(a, b) { return a.duration - b.duration; });
      sorted.forEach(function(item, idx) {
        var percent = item.duration / total;
        var startAngle = accumulated * 2 * Math.PI - Math.PI / 2;
        var endAngle = (accumulated + percent) * 2 * Math.PI - Math.PI / 2;
        var x1 = cx + r * Math.cos(startAngle);
        var y1 = cy + r * Math.sin(startAngle);
        var x2 = cx + r * Math.cos(endAngle);
        var y2 = cy + r * Math.sin(endAngle);
        var largeArc = percent > 0.5 ? 1 : 0;
        var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        var d;
        if (mode === 'pie') {
          d = 'M ' + cx + ' ' + cy + ' L ' + x1 + ' ' + y1 + ' A ' + r + ' ' + r + ' 0 ' + largeArc + ' 1 ' + x2 + ' ' + y2 + ' Z';
          path.setAttribute('fill', getTypeColor(idx, totalItems));
          path.setAttribute('stroke', 'none');
        } else {
          d = 'M ' + x1 + ' ' + y1 + ' A ' + r + ' ' + r + ' 0 ' + largeArc + ' 1 ' + x2 + ' ' + y2;
          path.setAttribute('fill', 'none');
          path.setAttribute('stroke', getTypeColor(idx, totalItems));
          path.setAttribute('stroke-width', strokeWidth);
          path.setAttribute('stroke-linecap', 'round');
        }
        path.setAttribute('d', d);
        svg.appendChild(path);
        accumulated += percent;
      });
    }

    buildChart(svgA, items, total, totalItems, mode);
    buildChart(svgB, items, total, totalItems, mode);

    var legendHtml = '';
    items.forEach(function(item) {
      legendHtml += '<li><span class="type-name">' + item.type + '</span><span class="type-duration">' + formatDuration(item.duration) + '</span><span class="type-percent">' + item.percent.toFixed(1) + '%</span></li>';
    });
    legendList.innerHTML = legendHtml;
  }

  // ========== 图表切换 ==========
  function toggleChartMode() {
    store.chartMode = (store.chartMode === 'arc') ? 'pie' : 'arc';
    saveStore();
    renderStats();
    document.querySelectorAll('.chart-toggle-btn').forEach(function(btn) {
      btn.textContent = (store.chartMode === 'arc') ? '◔' : '◉';
    });
  }

  document.querySelectorAll('.chart-toggle-btn').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      toggleChartMode();
    });
  });

  // ========== 布局切换 ==========
  function setLayout(mode) {
    store.layoutMode = mode;
    saveStore();
    var layoutA = document.getElementById('layoutA');
    var layoutB = document.getElementById('layoutB');
    var toggle = document.getElementById('layoutToggle');
    if (mode === 'a') {

  function hslToHex(h, s, l) {
    s /= 100;
    l /= 100;
    var c = (1 - Math.abs(2 * l - 1)) * s;
    var x = c * (1 - Math.abs((h / 60) % 2 - 1));
    var m = l - c / 2;
    var r, g, b;
    if (h < 60) { r = c; g = x; b = 0; }
    else if (h < 120) { r = x; g = c; b = 0; }
    else if (h < 180) { r = 0; g = c; b = x; }
    else if (h < 240) { r = 0; g = x; b = c; }
    else if (h < 300) { r = x; g = 0; b = c; }
    else { r = c; g = 0; b = x; }
    r = Math.round((r + m) * 255);
    g = Math.round((g + m) * 255);
    b = Math.round((b + m) * 255);
    return '#' + [r, g, b].map(function(c) { return c.toString(16).padStart(2, '0'); }).join('');
  }

    planViewDate = d.toISOString().slice(0,10);
    renderPlans();
  });
  document.getElementById('planNextBtn').addEventListener('click', function() {
    var d = new Date(planViewDate + 'T00:00:00');
    d.setDate(d.getDate() + 1);
    planViewDate = d.toISOString().slice(0,10);
    renderPlans();
  });
  document.getElementById('planTodayBtn').addEventListener('click', function() {
    planViewDate = getToday();
    renderPlans();
  });
  document.getElementById('planAddBtn').addEventListener('click', function() {
    var input = document.getElementById('planInput');
    var text = input.value.trim();
    if (!text) return;
    if (planViewDate !== getToday()) { alert('只能向今天添加计划'); return; }
    store.plans.push({ id: Date.now() + '_' + Math.random().toString(36).substr(2,4), text: text, done: false, date: getToday() });
    saveStore();
    input.value = '';
    renderPlans();
  });
  document.getElementById('planInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') document.getElementById('planAddBtn').click();
  });

  // ========== 个人资料 ==========
  function renderProfileStats() {
    var totalSec = store.timerRecords.reduce(function(acc, r) { return acc + (r.durationSec || 0); }, 0);
    var totalHours = totalSec / 3600;
    var daysSet = new Set();
    store.timerRecords.forEach(function(r) { daysSet.add(r.date); });
    var activeDays = daysSet.size || 0;
    document.getElementById('profileTotal').textContent = totalHours.toFixed(1);
    document.getElementById('profileDays').textContent = activeDays;
    document.getElementById('profilePosts').textContent = store.tweets.length;
  }

  document.getElementById('profileSaveBtn').addEventListener('click', function() {
    store.profile.name = document.getElementById('profileNameInput').value.trim() || '我';
    store.profile.ip = document.getElementById('profileIpInput').value.trim() || '上海';
    saveStore();
    updateTopRight();
    alert('✅ 已保存');
  });

  // 长按编辑 bio
  var bioDisplay = document.getElementById('bioDisplay');
  var bioInput = document.getElementById('bioInput');
  var bioTimer = null;
  bioDisplay.addEventListener('mousedown', function() {
    bioTimer = setTimeout(function() {
      bioDisplay.style.display = 'none';
      bioInput.style.display = 'block';
      bioInput.value = store.profile.bio || '极简 · 专注';
      bioInput.focus();
      bioInput.select();
    }, 800);
  });
  bioDisplay.addEventListener('mouseup', function() { clearTimeout(bioTimer); });
  bioDisplay.addEventListener('mouseleave', function() { clearTimeout(bioTimer); });
  bioDisplay.addEventListener('touchstart', function(e) {
    bioTimer = setTimeout(function() {
      bioDisplay.style.display = 'none';
      bioInput.style.display = 'block';
      bioInput.value = store.profile.bio || '极简 · 专注';
      bioInput.focus();
      bioInput.select();
    }, 800);
  });
  bioDisplay.addEventListener('touchend', function() { clearTimeout(bioTimer); });
  bioDisplay.addEventListener('touchmove', function() { clearTimeout(bioTimer); });

  bioInput.addEventListener('blur', function() {
    var val = this.value.trim() || '极简 · 专注';
    store.profile.bio = val;
    saveStore();
    bioDisplay.textContent = val;
    bioDisplay.style.display = 'block';
    bioInput.style.display = 'none';
  });
  bioInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { this.blur(); }
  });

  // 头像上传
  document.getElementById('profileAvatar').addEventListener('click', function() {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = function(e) {
      var file = e.target.files[0];
      if (file) {
        var reader = new FileReader();
        reader.onload = function(ev) {
          store.profile.avatar = ev.target.result;
          saveStore();
          updateTopRight();
          document.getElementById('profileAvatar').style.backgroundImage = 'url(' + ev.target.result + ')';
        };
        reader.readAsDataURL(file);
      }
    };
    input.click();
  });

  // 导出/导入
  var modalOverlay = document.createElement('div');
  modalOverlay.className = 'modal-overlay';
  modalOverlay.id = 'modalOverlay';
  modalOverlay.innerHTML = '<div class="modal-box"><button class="modal-btn" id="exportBtn">导出</button><button class="modal-btn" id="importBtn">导入</button><button class="modal-cancel" id="modalCancel">取消</button></div>';
  document.body.appendChild(modalOverlay);

  var style = document.createElement('style');
  style.textContent = '.modal-btn { display: block; width: 100%; padding: 0.7rem 0; border: none; border-radius: 40px; font-size: 1rem; font-weight: 450; cursor: pointer; margin-bottom: 0.6rem; background: #1e1e1e; color: white; } .modal-cancel { display: block; width: 100%; padding: 0.5rem 0; border: none; background: transparent; color: #999; font-size: 0.95rem; cursor: pointer; margin-top: 0.2rem; }';
  document.head.appendChild(style);

  document.getElementById('modalCancel').addEventListener('click', function() {
    document.getElementById('modalOverlay').classList.remove('active');
  });
  document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('active');
  });

  document.getElementById('exportBtn').addEventListener('click', function() {
    var dataStr = localStorage.getItem('focusMeData');
    if (!dataStr) { alert('暂无数据可备份'); return; }
    var blob = new Blob([dataStr], {type: 'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'focus_backup_' + getToday() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    document.getElementById('modalOverlay').classList.remove('active');
    alert('✅ 备份已下载！');
  });

  document.getElementById('importBtn').addEventListener('click', function() {
    document.getElementById('modalOverlay').classList.remove('active');
    document.getElementById('fileInput').click();
  });

  document.getElementById('fileInput').addEventListener('change', function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
      try {
        var importedData = JSON.parse(ev.target.result);
        if (importedData.timerRecords && importedData.tweets) {
          if (confirm('⚠️ 导入将覆盖当前所有数据，确定继续吗？')) {
            localStorage.setItem('focusMeData', JSON.stringify(importedData));
            loadStore();
            renderTweets();
            renderPlans();
            renderProfileStats();
            renderTypeLabel();
            updateTopRight();
            if (isStatsOpen) renderStats();
            if (isMoodOpen) renderMood();
            alert('✅ 数据恢复成功！');
          }
        } else {
          alert('❌ 无效的备份文件');
        }
      } catch(e) {
        alert('❌ 文件解析失败，请确认是备份文件');
      }
    };
    reader.readAsText(file);
    this.value = '';
  });

  // ========== 日历功能 ==========
  var calYear, calMonth, calSelectedDate = null;
  function openCalendar() {
    var today = new Date();
    calYear = today.getFullYear();
    calMonth = today.getMonth();
    calSelectedDate = planViewDate;
    document.getElementById('calendarOverlay').classList.add('active');
    renderCalendar();
  }
  function closeCalendar() {
    document.getElementById('calendarOverlay').classList.remove('active');
  }
  function renderCalendar() {
    document.getElementById('calTitle').textContent = calYear + '年' + (calMonth+1) + '月';
    var container = document.getElementById('calDays');
    container.innerHTML = '';
    var firstDay = new Date(calYear, calMonth, 1).getDay();
    var daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
    var daysInPrevMonth = new Date(calYear, calMonth, 0).getDate();
    for (var i = 0; i < firstDay; i++) {
      var btn = document.createElement('button');
      btn.textContent = daysInPrevMonth - firstDay + i + 1;
      btn.className = 'other-month';
      btn.disabled = true;
      container.appendChild(btn);
    }
    for (var d = 1; d <= daysInMonth; d++) {
      var btn = document.createElement('button');
      btn.textContent = d;
      var dateStr = calYear + '-' + String(calMonth+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
      if (dateStr === calSelectedDate) btn.classList.add('selected');
      btn.addEventListener('click', function() {
        document.querySelectorAll('.cal-days .selected').forEach(function(b) { b.classList.remove('selected'); });
        this.classList.add('selected');
        var day = parseInt(this.textContent);
        calSelectedDate = calYear + '-' + String(calMonth+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
      });
      container.appendChild(btn);
    }
    var remaining = 42 - (firstDay + daysInMonth);
    for (var r = 1; r <= remaining; r++) {
      var btn = document.createElement('button');
      btn.textContent = r;
      btn.className = 'other-month';
      btn.disabled = true;
      container.appendChild(btn);
    }
  }
  document.getElementById('calPrevMonth').addEventListener('click', function() {
    calMonth--;
    if (calMonth < 0) { calMonth = 11; calYear--; }
    renderCalendar();
  });
  document.getElementById('calNextMonth').addEventListener('click', function() {
    calMonth++;
    if (calMonth > 11) { calMonth = 0; calYear++; }
    renderCalendar();
  });
  document.getElementById('calConfirm').addEventListener('click', function() {
    if (calSelectedDate) {
      planViewDate = calSelectedDate;
      renderPlans();
    }
    closeCalendar();
  });
  document.getElementById('calendarOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeCalendar();
  });

  // 双击"今天"弹出日历
  var clickCount = 0, clickTimer = null;
  document.getElementById('planDateLabel').addEventListener('click', function() {
    clickCount++;
    if (clickCount === 1) {
      clickTimer = setTimeout(function() { clickCount = 0; }, 400);
    } else if (clickCount === 2) {
      clearTimeout(clickTimer);
      clickCount = 0;
      openCalendar();
    }
  });

  // ========== 初始化 ==========
  renderTypeLabel();
  setLayout(store.layoutMode);
  document.querySelectorAll('#statsTabs button').forEach(function(b) {
    if (b.dataset.tab === store.statsTab) b.classList.add('active');
    else b.classList.remove('active');
  });
  document.querySelectorAll('.chart-toggle-btn').forEach(function(btn) {
    btn.textContent = (store.chartMode === 'arc') ? '◔' : '◉';
  });
  renderTweets();
  renderPlans();
  renderProfileStats();
  updateTopRight();
  initMood();

  window.addEventListener('storage', function(e) {
    if (e.key === 'focusMeData') {
      loadStore();
      renderTypeLabel();
      renderTweets();
      renderPlans();
      renderProfileStats();
      updateTopRight();
      if (isStatsOpen) renderStats();
      if (isMoodOpen) renderMood();
    }
  });
})();
</script>
</body>
</html>
